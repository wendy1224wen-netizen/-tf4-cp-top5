<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090a12" />
    <meta
      name="description"
      content="28组TF家族四代一班CP，两两对决，选出你的个人TOP 5。"
    />
    <title>四代一班 · CP心选局</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090a12'/%3E%3Cpath d='M32 49 14 31c-8-9 5-23 15-12l3 3 3-3c10-11 23 3 15 12Z' fill='%23ff4f9a'/%3E%3Cpath d='M20 18h24' stroke='%236fe9ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main id="app" class="app-shell">
      <section id="startScreen" class="screen start-screen" aria-labelledby="startTitle">
        <header class="site-header">
          <a class="brand" href="#" aria-label="返回首页">
            <span class="brand-mark" aria-hidden="true">4</span>
            <span>四代一班</span>
          </a>
          <span class="header-note">CP PICK · TOP 5</span>
        </header>

        <div class="start-layout">
          <div class="hero-copy">
            <p class="eyebrow"><span></span> 28组CP · 二选一</p>
            <h1 id="startTitle">谁会留在你的<br /><em>心选 TOP 5</em>？</h1>
            <p class="hero-description">
              两两对决，多轮重组。每一次选择都会缩小范围，直到你的五组偏爱依次落位。
            </p>

            <div class="start-actions">
              <button id="startBtn" class="primary-button" type="button">
                <span>开始测试</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
              </button>
              <button id="continueBtn" class="secondary-button is-hidden" type="button">
                继续上次进度
              </button>
            </div>

            <div id="resumeNote" class="resume-note is-hidden" aria-live="polite"></div>

            <dl class="quick-stats" aria-label="测试信息">
              <div><dt>28</dt><dd>组CP</dd></div>
              <div><dt>2</dt><dd>选1</dd></div>
              <div><dt>5</dt><dd>最终席位</dd></div>
            </dl>
          </div>

          <div class="photo-stage" aria-hidden="true">
            <div class="orbit orbit-a"></div>
            <div class="orbit orbit-b"></div>
            <figure class="photo-tile tile-one">
              <img src="./assets/cp/IMG_7408.jpeg" alt="" />
              <figcaption>01 · 奇文</figcaption>
            </figure>
            <figure class="photo-tile tile-two">
              <img src="./assets/cp/IMG_7418.jpeg" alt="" />
              <figcaption>10 · 恒奇</figcaption>
            </figure>
            <figure class="photo-tile tile-three">
              <img src="./assets/cp/IMG_7429.jpeg" alt="" />
              <figcaption>20 · 铭瑞</figcaption>
            </figure>
            <span class="sticker sticker-top">PICK</span>
            <span class="sticker sticker-bottom">TOP 5</span>
          </div>
        </div>

        <p class="start-footnote">进度仅保存在当前设备 · 随时可以回来继续</p>
      </section>

      <section id="gameScreen" class="screen game-screen is-hidden" aria-labelledby="gameQuestion">
        <header class="game-header">
          <button id="homeBtn" class="brand brand-button" type="button" aria-label="返回测试首页">
            <span class="brand-mark" aria-hidden="true">4</span>
            <span>CP心选局</span>
          </button>
          <div class="choice-counter"><strong id="choiceCount">0</strong><span>次选择</span></div>
        </header>

        <div class="progress-wrap" aria-label="测试进度">
          <div class="progress-meta">
            <span id="stageLabel">全员初筛</span>
            <span id="progressLabel">0%</span>
          </div>
          <div class="progress-track"><span id="progressBar"></span></div>
        </div>

        <div class="game-heading">
          <p id="roundLabel" class="round-label">ROUND 01</p>
          <h2 id="gameQuestion">这一刻，你更偏爱哪一对？</h2>
          <p>点击照片完成选择，系统会继续重组对决。</p>
        </div>

        <div class="versus-grid" aria-live="polite">
          <button id="leftCard" class="choice-card" type="button">
            <span class="card-index" id="leftIndex">01</span>
            <span class="image-frame"><img id="leftImage" src="" alt="" decoding="async" fetchpriority="high" /></span>
            <span class="card-copy">
              <strong id="leftName"></strong>
              <small id="leftPair"></small>
            </span>
            <span class="pick-hint">选TA们</span>
          </button>

          <div class="versus-mark" aria-hidden="true"><span>VS</span></div>

          <button id="rightCard" class="choice-card" type="button">
            <span class="card-index" id="rightIndex">02</span>
            <span class="image-frame"><img id="rightImage" src="" alt="" decoding="async" fetchpriority="high" /></span>
            <span class="card-copy">
              <strong id="rightName"></strong>
              <small id="rightPair"></small>
            </span>
            <span class="pick-hint">选TA们</span>
          </button>
        </div>

        <div class="game-tools" aria-label="测试工具">
          <button id="undoBtn" class="tool-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h9a7 7 0 1 1 0 14h-1" /></svg>
            撤回
          </button>
          <button id="saveBtn" class="tool-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5zM8 4v6h8V4M8 20v-6h8v6" /></svg>
            保存进度
          </button>
          <span class="keyboard-tip">键盘：← / → 选择</span>
        </div>
      </section>

      <section id="resultScreen" class="screen result-screen is-hidden" aria-labelledby="resultTitle">
        <header class="site-header result-header">
          <span class="brand">
            <span class="brand-mark" aria-hidden="true">4</span>
            <span>四代一班</span>
          </span>
          <span class="header-note">RESULT CARD</span>
        </header>

        <div class="result-intro">
          <p class="eyebrow"><span></span> 测试完成</p>
          <h1 id="resultTitle">你的心选 <em>TOP 5</em></h1>
          <p>这五组，从28组对决里一路留到了最后。</p>
        </div>

        <ol id="resultList" class="result-list"></ol>

        <div class="result-actions">
          <button id="posterBtn" class="primary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM7 15l3-3 2 2 2-2 3 3M15.5 9.5h.01" /></svg>
            生成结果图
          </button>
          <button id="shareBtn" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4M5 13v7h14v-7" /></svg>
            分享结果
          </button>
          <button id="resultUndoBtn" class="ghost-button" type="button">撤回最后选择</button>
          <button id="restartBtn" class="ghost-button" type="button">重新测试</button>
        </div>
      </section>
    </main>

    <dialog id="posterDialog" class="poster-dialog">
      <div class="dialog-topline">
        <div><strong>结果图已生成</strong><span>长按图片也可以保存</span></div>
        <button id="closeDialogBtn" type="button" aria-label="关闭结果图">×</button>
      </div>
      <img id="posterPreview" alt="你的CP心选TOP 5结果图" />
      <button id="downloadBtn" class="primary-button" type="button">保存图片</button>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <canvas id="resultCanvas" class="is-hidden" width="1080" height="1350"></canvas>

    <script src="./app.js"></script>
  </body>
</html>
